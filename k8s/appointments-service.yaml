apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointments-service
  namespace: ourhome
spec:
  replicas: 2
  selector:
    matchLabels: { app: appointments-service }
  template:
    metadata:
      labels: { app: appointments-service }
    spec:
      containers:
        - name: appointments-service
          image: <OCIR_REGION>.ocir.io/<OCIR_NAMESPACE>/ourhome/appointments-service:latest
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef: { name: ourhome-config }
            - secretRef: { name: ourhome-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4003 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: appointments-service
  namespace: ourhome
spec:
  selector: { app: appointments-service }
  ports:
    - port: 4003
      targetPort: 4003
