apiVersion: v1
kind: ConfigMap
metadata:
  name: ourhome-config
  namespace: ourhome
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  APP_URL: "http://localhost:3000" # replace with your real public URL / Ingress host
  AUTH_SERVICE_URL: "http://auth-service:4001"
  PROPERTIES_SERVICE_URL: "http://properties-service:4002"
  APPOINTMENTS_SERVICE_URL: "http://appointments-service:4003"
  INQUIRIES_SERVICE_URL: "http://inquiries-service:4004"
  FAVORITES_SERVICE_URL: "http://favorites-service:4005"
  SUPPORT_SERVICE_URL: "http://support-service:4006"
  CHAT_SERVICE_URL: "http://chat-service:4007"
