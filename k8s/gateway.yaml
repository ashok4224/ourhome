apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ourhome
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: us-central1-docker.pkg.dev/project-3cfee066-7cd7-4c90-baa/ourhome/gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: ourhome-config }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ourhome
  # GKE: a bare `type: LoadBalancer` provisions a Google Cloud external Network
  # Load Balancer (TCP passthrough) via the GKE Cloud Controller Manager — no
  # cloud-specific annotations required (the OCI annotations were removed).
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 3000
