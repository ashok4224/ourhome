apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ourhome
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: <OCIR_REGION>.ocir.io/<OCIR_NAMESPACE>/ourhome/gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: ourhome-config }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ourhome
  annotations:
    # Pinned to 10-10 Mbps: that's the exact Always Free Load Balancer
    # allocation. Raising flex-max above 10 bills per-Mbps beyond that
    # baseline — only do it once you've deliberately decided to pay for it.
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 3000
