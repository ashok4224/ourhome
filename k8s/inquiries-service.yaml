apiVersion: apps/v1
kind: Deployment
metadata:
  name: inquiries-service
  namespace: ourhome
spec:
  replicas: 2
  selector:
    matchLabels: { app: inquiries-service }
  template:
    metadata:
      labels: { app: inquiries-service }
    spec:
      containers:
        - name: inquiries-service
          image: us-central1-docker.pkg.dev/project-3cfee066-7cd7-4c90-baa/ourhome/inquiries-service:latest
          ports:
            - containerPort: 4004
          envFrom:
            - configMapRef: { name: ourhome-config }
            - secretRef: { name: ourhome-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: inquiries-service
  namespace: ourhome
spec:
  selector: { app: inquiries-service }
  ports:
    - port: 4004
      targetPort: 4004
