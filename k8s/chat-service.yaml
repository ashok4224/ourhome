# replicas pinned to 1: chat-service's SSE client list and typing state are
# in-process memory (services/chat-service/src/realtime.ts). Scaling this
# past 1 replica will silently break chat for connections on other pods —
# add Redis pub/sub before ever bumping this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: ourhome
spec:
  replicas: 1
  selector:
    matchLabels: { app: chat-service }
  template:
    metadata:
      labels: { app: chat-service }
    spec:
      containers:
        - name: chat-service
          image: us-central1-docker.pkg.dev/project-3cfee066-7cd7-4c90-baa/ourhome/chat-service:latest
          ports:
            - containerPort: 4007
          envFrom:
            - configMapRef: { name: ourhome-config }
            - secretRef: { name: ourhome-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4007 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4007 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: ourhome
spec:
  selector: { app: chat-service }
  ports:
    - port: 4007
      targetPort: 4007
