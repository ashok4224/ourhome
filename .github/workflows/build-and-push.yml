name: Build and Push Images

# CI: builds all 8 OurHome services as linux/amd64 (GKE nodes are x86_64 —
# the OCI deployment built linux/arm64 for its A1.Flex nodes, which would not
# run on GKE) and pushes them to Google Artifact Registry.
#
# Images land at <location>-docker.pkg.dev/<project>/ourhome/<service>
# (tagged :latest and :<git-sha>), matching the image references in k8s/*.yaml.

on:
  push:
    branches: [main, microservices]
    paths:
      - "services/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - properties-service
          - appointments-service
          - inquiries-service
          - favorites-service
          - support-service
          - chat-service
          - gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ourhome/${{ matrix.service }}:latest
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ourhome/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
